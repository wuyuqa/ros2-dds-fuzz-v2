[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "r2f"
version = "0.1.0"
description = "Offline contracts and public ROS2 conformance evidence"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"r2f.modules.s1" = ["s1_coverage.json", "seed_lineage.json", "fastdds_lifecycle_calibration.json"]

[project.optional-dependencies]
test = ["pytest>=7.4,<10", "pytest-xdist>=3.5,<4", "setuptools>=61", "wheel"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
