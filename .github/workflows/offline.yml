name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      R2F_NATIVE_DDS_TESTS: '0'
      R2F_BOUNDARY_KERNEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run the shared offline command
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_offline.py --junitxml=offline-junit.xml 2>&1 | tee offline-check.log
      - name: Preserve offline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-python-${{ matrix.python-version }}
          path: |
            offline-check.log
            offline-junit.xml
          if-no-files-found: warn
          retention-days: 14
