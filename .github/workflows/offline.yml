name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      R2F_NATIVE_DDS_TESTS: '0'
      R2F_BOUNDARY_KERNEL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install pinned historical evidence
        shell: bash
        run: |
          set -euo pipefail
          # Prepare only these exact parents on fresh hosted runners.
          for evidence_parent in \
            /home/wuyuqa/ros2-dds-fuzz-v2/results/main-review/s1-frontier-repair-20261118/f1-control-owner/isolated-scope-v2 \
            /home/wuyuqa/ros2-dds-fuzz-v2/results/main-review/s1-final-breadth-prep-20261120/continuation-db4f12e/live-remaining-fifteen
          do
            if [ ! -e "$evidence_parent" ] && [ ! -L "$evidence_parent" ]; then
              sudo mkdir -p -- "$evidence_parent"
              sudo chown -- "$(id -u):$(id -g)" "$evidence_parent"
            fi
          done
          # Existing originals are verified read-only, never overwritten.
          python scripts/prepare_offline_evidence.py
          python scripts/prepare_offline_evidence.py --capsule p16
      - name: Run the shared offline command
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_offline.py -p xdist.plugin -n 2 --dist loadfile --junitxml=offline-junit.xml 2>&1 | tee offline-check.log
      - name: Preserve offline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-python-${{ matrix.python-version }}
          path: |
            offline-check.log
            offline-junit.xml
          if-no-files-found: warn
          retention-days: 14
